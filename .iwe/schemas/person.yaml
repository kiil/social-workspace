$schema: https://document-schema.org/draft/2026-06/schema
description: A person the user wants to stay in touch with, with a concrete next step
frontmatter:
  type: object
  required: [type, title, description, relationship]
  properties:
    type: { const: person }
    title: { type: string, minLength: 1 }
    description: { type: string }
    relationship: { enum: [acquaintance, friend, close-friend, colleague, contact, community, romantic, family] }
    met: { type: string, format: date }
    met_at: { type: string }
    last_contact: { type: string, format: date }
    next_step: { type: string }
    next_step_due: { type: string, format: date }
    is_example: { type: boolean }
