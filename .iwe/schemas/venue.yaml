$schema: https://document-schema.org/draft/2026-06/schema
description: A place worth investing in — why it works and how to use it
frontmatter:
  type: object
  required: [type, title, description, mode]
  properties:
    type: { const: venue }
    title: { type: string, minLength: 1 }
    description: { type: string }
    mode: { enum: [belonging, contributing, event, online] }
    recurrence: { enum: [daily, weekly, monthly, seasonal, one-off] }
    tags: { type: array, items: { type: string } }
    is_example: { type: boolean }
